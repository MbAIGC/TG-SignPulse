name: Lint & Test & Frontend Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "ruff==0.14.6" "pytest>=9.0.1" "pytest-asyncio>=1.3.0"

      - name: ruff check
        run: ruff check backend/ tg_signer/

      - name: pytest
        run: pytest tests -o addopts="-vv -W=ignore::DeprecationWarning:pyrogram.utils"
        env:
          PYTHONPATH: "."

  frontend:
    name: Frontend (vue-tsc + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # 显式包含 dev 依赖（vue-tsc 等构建工具），避免环境默认 omit=dev 导致构建失败
        run: npm ci --include=dev --no-audit --no-fund

      - name: Production build
        # 生产构建不需要 NODE_ENV=development；vite build 默认以生产模式打包，
        # 移除该变量避免「生产构建 + development 环境」语义冲突。
        run: npm run build
