services:
  app:
    image: ghcr.io/mbaigc/tg-signpulse:latest
    container_name: tg-signpulse
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # JWT 密钥：请务必设置高强度随机值（如 `openssl rand -hex 32`）。
      # 不设置时应用会自动生成并持久化到 <data>/.app_secret_key。
      # 注意：不得使用 your_secret_key 等弱值，启动会被拒绝。
      - APP_SECRET_KEY=${APP_SECRET_KEY:-}
      # 可选：首次启动时预设管理员密码（不设置则密码写入 /data/.admin_bootstrap_password）
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # 跨进程账号级执行锁：默认开启（多 worker/多进程部署必需）。
      # 单进程部署可设为 0 关闭以省去文件锁开销。
      - ACCOUNT_LOCK_FILE=${ACCOUNT_LOCK_FILE:-1}
      # 仅在前置反向代理可信并正确覆盖转发头时启用。
      - APP_TRUST_PROXY_HEADERS=${APP_TRUST_PROXY_HEADERS:-0}
      # 容器入口按 /data 属主自适应运行身份；如需关闭权限修复设为 0
      # - APP_AUTO_FIX_DATA_PERMS=0
    # 安全加固：默认丢弃全部 capability，只加回入口脚本降权所需的最小集合
    # （chown/chmod 需要 CHOWN、FOWNER、DAC_OVERRIDE；gosu 需要 SETUID/SETGID）。
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
